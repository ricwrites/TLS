<!doctype html>
<html>
<head>
  <title>TLS Login</title>
  <link rel="stylesheet" href="styletls.css">
</head>
<body id="parent">
  <header class="header">
    <img class="headimg" src="./assets/TLS.jpg">
    <h1 class="pagetitle">The Learning Sanctuary</h1>
  </header>
  <h2 class="pagesubtitle">Tura</h2>

  <div class="loginbit">
    <h1>Login</h1>
    <form id="loginForm">
      <label>Username: <input type="text" name="username" required></label><br>
      <label>Password: <input type="password" name="password" required></label><br>
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    const API_URL = "https://tls-server.onrender.com";
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = {
        username: formData.get('username'),
        password: formData.get('password')
      };

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!res.ok) {
          alert('Invalid login');
          return;
        }

        const json = await res.json();
        if (json.role === 'teacher') {
          window.location.href = '/home.html';
        } else if (json.role === 'admin') {
          window.location.href = '/admin';
        }
      } catch (err) {
        console.error('Login error:', err);
        alert('Login failed. Try again.');
      }
    });
  </script>
</body>
</html>
